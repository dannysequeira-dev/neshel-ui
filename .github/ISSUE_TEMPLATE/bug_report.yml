name: Bug report
description: Report a reproducible issue in Neshel-UI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include an isolated example or steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: "@neshel-ui/components@0.1.0"
    validations:
      required: true
