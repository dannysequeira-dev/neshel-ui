# Release pipeline (feature 006, ADR 0017, specs/006-docs-dx-release/contracts/release.md).
#
# Nothing here runs on branch pushes or pull requests. Publication happens only when the owner
# pushes a tag `vX.Y.Z` AND approves the protected `npm-release` environment. A manual run
# (workflow_dispatch) is always a dry run (pnpm release:simulate) and publishes nothing.
#
# 0.1.0 was published from tag v0.1.0 by run 42843343125 with a bootstrap token; that tag keeps the
# workflow as it was and is never rerun. From here on the publish job uses npm trusted publishing
# (OIDC, `id-token: write`) and has no npm credential: before the next tag, the owner configures a
# trusted publisher per package (repository dannysequeira-dev/neshel-ui, workflow `release.yml`,
# environment `npm-release`). Without it the publish step fails on authentication and publishes
# nothing. See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.guards.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Quality gates
        run: pnpm check
      - name: Release guards (tag = version of all five packages, none private, core private)
        id: guards
        if: github.event_name == 'push'
        run: node scripts/release-guards.mjs --tag "${{ github.ref_name }}"
      - name: Rehearsal (dry run of the version transition and npm publish)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm release:simulate
      - name: Pack the five public packages once
        if: github.event_name == 'push'
        run: node scripts/pack-local.mjs --out release-tarballs
      - name: Upload tarballs
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-tarballs
          path: release-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
      - name: npm with trusted publishing support (>= 11.5.1)
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" || npm install --global npm@11
          npm --version
      - name: Download tarballs
        uses: actions/download-artifact@v7
        with:
          name: release-tarballs
          path: release-tarballs
      # npm trusted publishing (OIDC): no npm token. Each package needs a trusted publisher for
      # this repository, workflow `release.yml` and environment `npm-release` (docs/releasing.md).
      - name: Publish in dependency order (idempotent)
        run: node scripts/publish-tarballs.mjs release-tarballs --version "${{ needs.verify.outputs.version }}"
      - name: Verify installation from the registry
        run: node scripts/publish-tarballs.mjs release-tarballs --version "${{ needs.verify.outputs.version }}" --verify-only
