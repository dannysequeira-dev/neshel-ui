# Documentation deployment to GitHub Pages (feature 006, ADR 0015).
#
# Manual only. Requires the owner to enable Pages first (Settings → Pages → Source: GitHub Actions)
# and to choose the public URL. Every CI run already uploads a preview artefact (`docs-preview`).
name: Deploy documentation

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Public origin, e.g. https://dannysequeira-dev.github.io (no trailing slash)"
        required: true
      base_path:
        description: "Base path, e.g. /neshel-ui for a project site ('' for a custom domain root)"
        required: false
        default: "/neshel-ui"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages and verify documentation
        run: |
          pnpm build:packages
          pnpm docs:api --check
          pnpm check:docs
      - name: Build the static site for the public URL
        env:
          NESHEL_DOCS_SITE_URL: ${{ inputs.site_url }}
          NESHEL_DOCS_BASE_PATH: ${{ inputs.base_path }}
        run: pnpm docs:build
      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
