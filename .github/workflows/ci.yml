name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: windows-latest
            node: "22"
          - os: macos-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the exact version from packageManager in the root package.json.
      # Runs before setup-node so its pnpm store cache can locate the pnpm binary.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # pnpm-lock.yaml is committed; CI never resolves dependencies itself.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: OS and repository health
        run: pnpm run doctor

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build:packages

      - name: Verify package exports
        run: pnpm check:exports

      - name: Build Vite consumer
        run: pnpm --filter @neshel-ui/playground-vite build

      - name: Build Storybook
        run: pnpm --filter @neshel-ui/storybook build
