name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede outdated pull request runs; every push to main keeps a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Node 26 (primary, .nvmrc) on every OS; Node 22 and 24 compatibility on Linux only.
      # Deliberately not a full OS x Node product (research R17).
      matrix:
        include:
          - os: ubuntu-latest
            node: "26"
          - os: windows-latest
            node: "26"
          - os: macos-latest
            node: "26"
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the exact version from packageManager in the root package.json.
      # Runs before setup-node so its pnpm store cache can locate the pnpm binary.
      - name: Set up pnpm
        # Third-party action pinned to the v6.1.1 commit (research R18).
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # pnpm-lock.yaml is committed; CI never resolves dependencies itself.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: OS and repository health
        run: pnpm run doctor

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build:packages

      - name: Package tests (built output)
        run: pnpm test:packages

      - name: Verify package exports
        run: pnpm check:exports

      # Packs every intended public package and validates the real tarballs
      # (manifest, targets, source maps, publint, attw, external consumer).
      - name: Verify packed artifacts
        run: pnpm check:pack --no-build

      # Installs packed tarballs into generated React 19 + Vite apps outside the workspace:
      # Tailwind v4, plain CSS, and a configured app that runs the packed `neshel generate`
      # (tools come from the registry). Builds feed the browser check.
      - name: Verify external consumers (Tailwind, plain CSS, configured)
        run: pnpm check:consumer --no-build --artifacts "${{ runner.temp }}/neshel-consumers"

      # Computed-style precedence matrix in headless Chrome (preinstalled on GitHub runners).
      - name: Browser cascade check
        run: pnpm check:browser --consumers "${{ runner.temp }}/neshel-consumers"

      - name: Build Vite consumer
        run: pnpm --filter @neshel-ui/playground-vite build

      - name: Build Storybook
        run: pnpm --filter @neshel-ui/storybook build
