name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede outdated pull request runs; every push to main keeps a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Node 26 (primary, .nvmrc) on every OS; Node 22 and 24 compatibility on Linux only.
      # Deliberately not a full OS x Node product (research R17).
      matrix:
        include:
          - os: ubuntu-latest
            node: "26"
          - os: windows-latest
            node: "26"
          - os: macos-latest
            node: "26"
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the exact version from packageManager in the root package.json.
      # Runs before setup-node so its pnpm store cache can locate the pnpm binary.
      - name: Set up pnpm
        # Third-party action pinned to the v6.1.1 commit (research R18).
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # pnpm-lock.yaml is committed; CI never resolves dependencies itself.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: OS and repository health
        run: pnpm run doctor

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build:packages

      - name: Package tests (built output)
        run: pnpm test:packages

      - name: Verify package exports
        run: pnpm check:exports

      # Packs every intended public package and validates the real tarballs
      # (manifest, targets, source maps, publint, attw, external consumer).
      - name: Verify packed artifacts
        run: pnpm check:pack --no-build

      # Installs packed tarballs into generated React 19 + Vite apps outside the workspace:
      # Tailwind v4 and plain CSS (layout + typography), component labs (feature 005: Tailwind,
      # plain, extend, replace; SSR prerender; tree-shaking), a configured theme app, and custom
      # breakpoint apps (extend + Tailwind, replace + plain CSS) that run the packed
      # `neshel generate`, type-check in Bundler and NodeNext resolution and prerender (SSR).
      # Tools come from the registry. Builds feed the browser check.
      - name: Verify external consumers (zero-config, configured, custom breakpoints)
        run: pnpm check:consumer --no-build --artifacts "${{ runner.temp }}/neshel-consumers"

      # Computed-style precedence matrix, layout cases, breakpoint boundary sweeps and Capsize
      # geometry in headless Chrome (preinstalled on GitHub runners).
      - name: Browser computed-style check
        run: pnpm check:browser --consumers "${{ runner.temp }}/neshel-consumers"

      # Feature 005: real-input interaction, focus, Escape, selection, shell/mobile transitions,
      # nested-theme portals, reduced motion, hydration and axe-core checks against the packed
      # component consumers (Tailwind, plain CSS, extend and replace breakpoints).
      - name: Browser interaction and accessibility check (components)
        run: pnpm check:browser:components --consumers "${{ runner.temp }}/neshel-consumers"

      - name: Build Vite consumer
        run: pnpm --filter @neshel-ui/playground-vite build

      - name: Build Storybook
        run: pnpm --filter @neshel-ui/storybook build

      # The Storybook build regenerates its committed breakpoint declarations; they must not change.
      - name: Storybook generated declarations are committed and fresh
        run: git diff --exit-code -- apps/storybook/src/neshel.generated.d.ts

  # Feature 006: documentation website (ADR 0015). Builds the static export on every OS, checks API
  # freshness, export coverage, translations, links and type-checked snippets, then smoke-tests the
  # exported site in Chrome. The Linux export is uploaded as the preview artefact.
  docs:
    name: docs / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:packages
      - name: Generated API data is fresh
        run: pnpm docs:api --check
      - name: Documentation checks (coverage, translations, links, snippets, configurations)
        run: pnpm check:docs
      - name: Build the documentation site (static export)
        run: pnpm docs:build
      - name: Exported site smoke (navigation, search, i18n, theme, axe)
        run: pnpm check:docs-site
      - name: Upload preview artefact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: docs-preview
          path: apps/docs/out
          retention-days: 14

  # Feature 006: isolated Next.js App Router consumer from packed packages (R8) and the starters,
  # built from their deterministic ZIP archives with the packed packages (FR-032).
  integration:
    name: next + starters / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:packages
      - name: Next.js App Router consumer (packed packages, SSR, hydration, portals, breakpoints)
        run: pnpm check:next
      - name: Bundle budgets (packed packages; Button-only bundle free of Radix/Base UI)
        run: pnpm check:bundles
      - name: Starters (deterministic ZIPs, tarball install, build)
        run: pnpm check:starters --zip-out "${{ runner.temp }}/neshel-starters"

  # Feature 006 (R3, ADR 0016): Chromium, Firefox and WebKit smoke flows with Playwright against the
  # packed component consumers. WebKit is Playwright's WebKit build, not Safari.
  browsers:
    name: browsers / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build packages
        run: pnpm build:packages
      - name: Build component consumers from tarballs
        run: pnpm check:consumer --no-build --artifacts "${{ runner.temp }}/neshel-consumers"
      - name: Chromium, Firefox and WebKit smoke flows + axe
        run: pnpm check:browsers --consumers "${{ runner.temp }}/neshel-consumers" --report "${{ runner.temp }}/browsers-report.json"
      - name: Upload browser report (accessibility-tree evidence)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browsers-report-${{ matrix.os }}
          path: ${{ runner.temp }}/browsers-report.json
          if-no-files-found: ignore
