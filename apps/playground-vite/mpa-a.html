<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neshel-UI MPA transition — page a</title>
    <script>
      // Lab instrumentation (classic, render-blocking): records whether each navigation was revealed
      // with a cross-document View Transition (Chromium/WebKit) or plainly (fallback).
      (() => {
        var key = "neshel-mpa-log";
        function push(entry) {
          var log = JSON.parse(sessionStorage.getItem(key) || "[]");
          log.push(entry);
          sessionStorage.setItem(key, JSON.stringify(log));
        }
        addEventListener("pagereveal", (event) => {
          push({ page: "a", event: "pagereveal", vt: !!event.viewTransition, type: window.navigation?.activation?.navigationType });
        });
        addEventListener("pageswap", (event) => {
          push({ page: "a", event: "pageswap", vt: !!event.viewTransition });
        });
        addEventListener("load", () => {
          push({ page: "a", event: "load" });
        });
      })();
    </script>
  </head>
  <body class="mpa">
    <main id="mpa-main">
      <div class="mpa-hero mpa-hero-a" id="mpa-hero"></div>
      <h1 id="mpa-title">Chapter one</h1>
      <p>Cross-document View Transition (PT09): native where supported, plain navigation elsewhere.</p>
      <a id="mpa-next" href="./mpa-b.html">Go to page b</a>
      <a href="./animations.html">Back to the lab</a>
    </main>
    <script type="module" src="/src/mpa/mpa.ts"></script>
  </body>
</html>
